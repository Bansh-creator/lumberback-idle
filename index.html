<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lumberback Idle</title>
  <script type="module" crossorigin src="./assets/index-B50-SXKr.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-s65ggLTH.css">

<body>
<!-- Lumberback Idle splash — paste as the FIRST child of <body> in index.html (shows before the JS bundle loads).
     Generated from loading/splash.ts (SPLASH_CSS + splashMarkup('/loading/')). showSplash() adopts #lb-splash. -->
<style id="lb-splash-css">#lb-splash{z-index:9999;transition:opacity var(--lb-fade,.32s) ease;touch-action:none;-webkit-user-select:none;user-select:none;pointer-events:auto;background:linear-gradient(#5fbdf2,#8fd3ff 45%,#e6c987 75%);position:fixed;inset:0;overflow:hidden}#lb-splash.lb-out{opacity:0;pointer-events:none}#lb-splash picture,#lb-splash .lb-bg{width:100%;height:100%;position:absolute;inset:0}#lb-splash .lb-bg{object-fit:cover;object-position:50% 62%}#lb-splash .lb-title{left:50%;top:max(6vh,calc(env(safe-area-inset-top) + 18px));filter:drop-shadow(0 4px #1e140a2e);width:min(88vw,620px,52vh);height:auto;position:absolute;transform:translate(-50%)}#lb-splash .lb-barwrap{left:50%;bottom:max(9vh,calc(env(safe-area-inset-bottom) + 40px));text-align:center;width:min(64vw,340px);position:absolute;transform:translate(-50%)}#lb-splash .lb-bar{box-sizing:border-box;background:#9ae6fa;border-radius:18px;height:28px;padding:4px;box-shadow:0 0 0 4px #2d3142,0 6px 0 4px #00000040}#lb-splash .lb-track{background:#175a80;border-radius:12px;height:100%;overflow:hidden}#lb-splash .lb-fill{background:linear-gradient(#b8f0ff,#4cc9f0);border-radius:12px;width:4%;height:100%;transition:width .25s ease-out;box-shadow:inset 0 3px #ffffff73}#lb-splash .lb-label{color:#fff;text-shadow:0 0 3px #172814b3,0 2px #172814b3;letter-spacing:.02em;margin-top:12px;font:700 17px/1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}@media (orientation:landscape){#lb-splash .lb-title{width:min(46vw,560px,60vh);top:max(4vh,calc(env(safe-area-inset-top) + 10px))}#lb-splash .lb-barwrap{bottom:max(6vh,calc(env(safe-area-inset-bottom) + 18px))}}</style>
<div id="lb-splash">
<picture>
  <source media="(orientation: landscape)" srcset="loading/splash_bg_landscape_1920x1080.webp" type="image/webp">
  <source srcset="loading/splash_bg_portrait_1080x2340.webp" type="image/webp">
  <img class="lb-bg" src="./loading/splash_bg_portrait_1080x2340.jpg" alt="" decoding="async" fetchpriority="high">
</picture>
<img class="lb-title" src="./loading/splash_title.webp" alt="Lumberback Idle" decoding="async">
<div class="lb-barwrap" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
  <div class="lb-bar"><div class="lb-track"><div class="lb-fill"></div></div></div>
  <div class="lb-label">Loading…</div>
</div>
</div>
<!-- Island travel (28 Oct): hard zone swap reloads into the target island — show a plain travel card, not the splash art -->
<style>#lb-splash.lb-travel{background:#1d3a4a}#lb-splash.lb-travel picture,#lb-splash.lb-travel .lb-title,#lb-splash.lb-travel .lb-barwrap{display:none}#lb-splash .lb-travel-label{color:#fff;text-shadow:0 2px #00000059;place-items:center;font:800 20px/1.2 system-ui,sans-serif;display:grid;position:absolute;inset:0}</style>
<script>try{var lbT=sessionStorage.getItem('lb-travel');if(lbT==='1'||lbT==='2'){var lbS=document.getElementById('lb-splash');lbS.classList.add('lb-travel');var lbL=document.createElement('div');lbL.className='lb-travel-label';lbL.textContent=lbT==='2'?'Hardwood Ridge · Island 2':'Island 1';lbS.appendChild(lbL);}}catch(e){}</script>

  <div id="hud">
    <div class="pill cash"><span class="ico" aria-hidden="true"></span><span id="cash">0</span></div>
    <div class="pill wood" id="wood-pill"><span class="ico" aria-hidden="true"></span><span id="wood">0</span><span class="sep">/</span><span id="cap">0</span></div>
  </div>
  <div id="hint">Walk up to a tree to chop it</div>
  <div id="lvl-chips">
    <div id="stat-cargo" class="lvl-chip chip-cargo"></div>
    <div id="stat-axe" class="lvl-chip chip-axe"></div>
    <div id="stat-boots" class="lvl-chip chip-boots"></div>
  </div>
  <div id="joy"><div id="joy-knob"></div></div>
  <div id="fx"></div>
  <div id="help">WASD / arrows or drag to move</div>
</body>
</html>
